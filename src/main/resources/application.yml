spring:
  application:
    name: index-reviewer
    version: '@project.version@'

server:
  shutdown: graceful
  port: 8096

indices:
  smi:
    number-of-components: 20
    direct-selection-rank: 18
    buffer-rank: 22
    cap-percentage: 18

springdoc:
  swagger-ui:
    use-root-path: true
    operationsSorter: method
    display-request-duration: true
    url: /v3/api-docs
    doc-expansion: none

logging:
  level:
    root: INFO
    io.swagger.models.parameters.AbstractSerializableParameter: ERROR
    org:
      springframework:
        web: INFO
        cloud: ERROR
